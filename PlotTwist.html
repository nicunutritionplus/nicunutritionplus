const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => {a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a};
const today = () => {const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const words = s => (s.trim().match(/\S+/g)||[]).length;

function proj(){const L=S.levels[6]; if(!L.project) L.project={ms:{}}; return L.project}
function gate(n){
  const L=S.levels[n];
  if(C[n].live.type==='project'){
    const ms=proj().ms; const done=MILESTONES.filter(m=>ms[m.id]&&ms[m.id].status==='approved').length;
    return {know:L.know.passed, apply:L.apply.passed, live:done>=MILESTONES.length, liveCount:done, need:MILESTONES.length, label:'Project', all:L.know.passed&&L.apply.passed&&done>=MILESTONES.length};
  }
  const days=new Set(L.live.map(e=>e.day)).size;
  const liveCount = S.demo ? L.live.length : days;
  const live = liveCount>=3;
  return {know:L.know.passed, apply:L.apply.passed, live, liveCount:Math.min(liveCount,3), need:3, label:'Live', all:L.know.passed&&L.apply.passed&&live};
}
function status(n){
  if(n===1) return S.l1 ? 'done' : 'open';
  if(n===2) return S.levels[2].cleared ? 'done' : (S.l1 ? 'open' : 'locked');
  if(n===3) return S.levels[3].cleared ? 'done' : (S.levels[2].cleared||S.preview ? 'open' : 'locked');
  if(n>=4&&n<=6) return S.levels[n].cleared ? 'done' : (S.levels[n-1].cleared||S.preview ? 'open' : 'locked');
  return 'locked';
}
function stageDone(n,st){
  const L=S.levels[n];
  return st==='story'?L.story : st==='real'?L.real : st==='know'?L.know.passed : st==='apply'?L.apply.passed : gate(n).live;
}
function stageOpen(n,i){
  if(S.preview) return true;
  for(let k=0;k<i;k++) if(!stageDone(n,STAGES[k][0])) return false;
  return true;
}
function firstStage(n){
  for(let i=0;i<STAGES.length;i++) if(!stageDone(n,STAGES[i][0])) return STAGES[i][0];
  return 'live';
}
function checkCleared(n){
  const L=S.levels[n];
  if(!L.cleared && gate(n).all){L.cleared=true; T.banner=n}
}

    return `<button data-action="stage" data-stage="${k}" class="${done?'done':''}" aria-current="${stage===k}" ${open?'':'disabled'}><span class="n">${done?'✓':i+1}</span>${k==='live'&&C[n].live.type==='project'?'Project':label}</button>`;
  }).join('');
  let banner='';
  if(T.banner===n){
    banner = n===6 ? `<div class="banner good" role="status"><h3>Program complete</h3><p>You’ve finished all six levels. You noticed control, caught and checked your thoughts, built wins, planned your future, and changed something real. Come back in a few months and replay any chapter as a refresher.</p></div>`
    : `<div class="banner good" role="status"><h3>Level ${n} cleared</h3><p>You showed the skill in all three ways. Level ${n+1}, <b>${LEVELS[n].title}</b>, is now open.</p>

}

function sortHTML(n,st){
  const legend=`<div class="legend">${['permanent','pervasive','personal'].map(k=>`<div><b>${TRAPS[k].name}</b><span>${TRAPS[k].line}<br>${TRAPS[k].cue}</span></div>`).join('')}</div>`;
  const rows=Object.entries(C[n].thoughts).map(([id,t])=>{
    const r=st.sorted[id];
    const opts=['permanent','pervasive','personal'].map(k=>{
      let cls=''; if(r&&r.pick===k) cls=r.ok?'right':'wrong';
      return `<button class="opt ${cls}" data-action="sort" data-id="${id}" data-trap="${k}" ${r&&r.ok?'disabled':''}>${TRAPS[k].name}</button>`;
    }).join('');
    const fb = r ? (r.ok?`<div class="fb good"><b>Yes.</b> ${t.why}</div>`:`<div class="fb bad"><b>Not quite.</b> ${TRAPS[t.accept[0]].tip}</div>`) : '';
    return `<div class="sortrow"><div class="thought">${t.text}</div><div class="opts" role="group" aria-label="Choose a trap">${opts}</div>${fb}</div>`;
  }).join('');
  return `<div class="prose"><p>You caught four of Nia’s thoughts. Each one falls into a thinking trap. Pick the trap that’s loudest in each.</p></div>${legend}<div>${rows}</div>`;
}

  } else {

    const items=st.stOrder.map(si=>{

    }

function evalDispute(it,sel){
  const types=sel.map(i=>it.s[i][1]);

  if(!alt) return {ok:false, msg:'It’s missing another explanation for what happened.'};
  return {ok:true, msg: act?'Evidence, another explanation and a next step.':'Evidence and another explanation. Adding a next step would make it even stronger.'};
}
function coachHTML(){

function coachCheck(text){
  const t=' '+text.toLowerCase()+' ';
  const has=(arr)=>arr.some(w=>t.includes(w));
  const ev=has([' because',' last time',' last year',' last week',' actually',' got a',' scored',' fact',' evidence',' did ',' was ',' were ']) || /\d/.test(t);
  const alt=has([' maybe',' might',' could be',' could have',' another reason',' or ',' probably because',' instead']);
  const act=has([' next time',' i\'ll',' i’ll',' i will',' going to',' plan',' ask ',' try ',' practice']);
  const weak=has([' i\'m the best',' i’m the best',' amazing',' doesn\'t matter',' doesn’t matter',' whatever',' who cares',' dumb anyway',' never ',' always ',' everyone hates',' i\'m stupid',' i’m stupid']);
  const tags=[[ev?'Evidence ✓':'Evidence missing',ev?'good':'warn'],[alt?'Other explanation ✓':'Other explanation missing',alt?'good':'warn'],[act?'Next step ✓':'Next step missing',act?'good':'warn']];
  if(weak) tags.push(['Watch for trap words','bad']);
  let msg;
  if(words(text)<8) msg='Write a little more. A dispute usually takes two or three sentences.';
  else if(ev&&alt&&act&&!weak) msg='That has everything a strong dispute needs.';
  else if(weak) msg='Some words sound like a trap (always, never) or like brushing it off. Swap them for facts.';
  else msg='Good start. Add what’s missing above.';
  return {text, tags, msg};
}

        <button class="opt ${e.follow==='yes'?'right':''}" data-action="follow" data-id="${e.id}" data-v="yes">Yes</button>
        <button class="opt ${e.follow==='no'?'sel':''}" data-action="follow" data-id="${e.id}" data-v="no">Not yet</button></div></div>`
    : e.goal!=null ? `<div class="entry"><div class="meta"><span>${e.day} · Goal: ${esc(e.goal)}</span><button class="link" data-action="delEntry" data-id="${e.id}">Remove</button></div>
      <p><span class="muted">Step:</span> ${esc(e.step)}</p><p><span class="muted">Result:</span> ${esc(e.res)}</p>
      <p><span class="muted">My credit:</span> <q>${esc(e.credit)}</q></p><p><span class="muted">Could also work for:</span> ${esc(e.spread)}</p></div>` : `<div class="entry"><div class="meta"><span>${e.day}</span><button class="link" data-action="delEntry" data-id="${e.id}">Remove</button></div>
      <p><span class="muted">What happened:</span> ${esc(e.sit)}</p><p><q>${esc(e.th)}</q> ${e.trap?`<span class="chip warn">${TRAPS[e.trap].name}</span>`:''}</p>
      ${e.c?`<p><span class="muted">Then:</span> ${esc(e.c)}</p>`:''}${e.ev?`<p><span class="muted">Evidence:</span> ${esc(e.ev)}</p><p><span class="muted">Other explanation:</span> ${esc(e.alt)}</p><p><span class="muted">Next step:</span> ${esc(e.next)}</p>`:''}</div>`).join('')
    : `<p class="hint">No entries yet. Your first one will appear here.</p>`;
  const rule = `Entries must come from 3 different days. You have ${days} so far.`;
  return `<div class="panel stack"><div><span class="eyebrow">Gate 3 of 3 · Live</span><p class="muted">${C[n].live.intro}</p></div>
    <div class="row">${g.live?'<span class="chip good">Live: cleared</span>':`<span class="chip warn">${g.liveCount} of 3</span>`}<span class="hint">${rule}</span></div>
    <form id="liveForm" data-level="${n}" novalidate>${form}<div><button class="btn primary" type="submit">Save entry</button></div></form>${msg}${privacyNote()}</div>
    <div style="margin-top:16px">${supportNote()}</div>
    <div class="stack" style="margin-top:20px"><span class="eyebrow">Your entries</span><div class="entries">${list}</div></div>`;
}
function validateLive(n,f){
  const v=k=>(f.get(k)||'').toString().trim();
  if(C[n].live.type==='woop'){
    const w={id:Date.now(), day:today(), wish:v('wish'), out:v('out'), obs:v('obs'), plan:v('plan'), follow:null};
    if(words(w.wish)<3) return {err:'Write your wish in a few words.'};
    if(words(w.out)<4) return {err:'Describe the best outcome. Picture it, then write what you see.'};
    if(words(w.obs)<4) return {err:'Describe the obstacle in a full sentence.'};
    if(!/\b(i|i'm|i’m|my|me|myself)\b/i.test(w.obs)) return {err:'Name an obstacle inside you, something you do, think or feel. Use “I” or “my.”'};
    if(!/\b(if|when)\b/i.test(w.plan) || !/\b(then|i'll|i’ll|i will)\b/i.test(w.plan)) return {err:'Write the plan as “If ___, then I will ___.”'};
    if(words(w.plan)<6) return {err:'Make the “then” part a specific action you can take.'};
    return {entry:w};
  }
  if(C[n].live.type==='wins'){
    const w={id:Date.now(), day:today(), goal:v('goal'), step:v('step'), res:v('res'), credit:v('credit'), spread:v('spread')};
    if(words(w.goal)<3) return {err:'Write your goal in a few words.'};
    if(words(w.step)<3) return {err:'Describe the step you took. Keep it to one rung.'};
    if(words(w.res)<2) return {err:'Add what happened when you took the step.'};
    if(/\b(luck|lucky|easy|fluke|chance)\b/i.test(w.credit)) return {err:'Your credit mentions luck or an easy task. Name something <em>you</em> did.'};
    if(words(w.credit)<5) return {err:'Say more about what you did that made it work.'};
    if(words(w.spread)<3) return {err:'Name one other place this could work for you.'};
    return {entry:w};
  }
  const e={id:Date.now(), day:today(), sit:v('sit'), th:v('th')};
  if(words(e.sit)<3) return {err:'Add a few words about what happened.'};
  if(words(e.th)<4) return {err:'Write the thought as a full sentence, the way it sounded in your head.'};
  if(C[n].live.type==='catch'){
    e.trap=v('trap'); e.c=v('c');
    if(!e.trap) return {err:'Pick which trap it was. “No trap” is a fine answer if the thought was balanced.'};
    if(words(e.c)<2) return {err:'Add what you felt or did next. That’s the C in ABC.'};
  } else {
    e.ev=v('ev'); e.alt=v('alt'); e.next=v('next');
    if(words(e.ev)<5) return {err:'Add more evidence: at least one fact for or against the thought.'};
    if(words(e.alt)<5) return {err:'Add another explanation that fits the facts.'};
    if(words(e.next)<3) return {err:'Add a next step you could actually take.'};
  }
  return {entry:e};
}

/* ---- project (level 6) ---- */
function viewProject(n){
  const P=proj(); const msg=T.msMsg;
  let openFound=false;
  const cards=MILESTONES.map((m,mi)=>{
    const rec=P.ms[m.id]; const st=rec?rec.status:'draft';
    const prevOk = mi===0 || (P.ms[MILESTONES[mi-1].id]&&P.ms[MILESTONES[mi-1].id].status==='approved');
    const chip = st==='approved'?'<span class="chip good">Approved</span>' : st==='pending'?'<span class="chip accent">Waiting for review</span>' : st==='changes'?'<span class="chip warn">Changes requested</span>' : prevOk?'<span class="chip accent">Open</span>':'<span class="chip">Locked</span>';
    const head=`<div class="mshead"><div><span class="eyebrow">Milestone ${mi+1} · ${m.skill}</span><h3>${m.title}</h3></div>${chip}</div>`;
    const summary = rec&&rec.data ? `<dl>${m.fields.map(f=>`<dt>${f[2]}</dt><dd>${esc(rec.data[f[0]]||'')}</dd>`).join('')}</dl>` : '';
    const fbk = rec&&rec.feedback ? `<div class="fb ${st==='approved'?'good':'bad'}"><b>Your mentor:</b> ${esc(rec.feedback)}</div>` : '';
    if(st==='approved') return `<div class="ms">${head}${fbk}<details><summary>Show what you submitted</summary>${summary}</details></div>`;
    if(!prevOk) return `<div class="ms locked">${head}<p class="hint">Opens when milestone ${mi} is approved.</p></div>`;
    if(st==='pending') return `<div class="ms">${head}<p>Sent for review on ${rec.submitted}. Ask your parent or mentor to open Mentor view on this device. They’ll approve it or ask for changes.</p>
      <div><button class="btn" data-action="nav" data-to="mentor">Open Mentor view</button></div>
      <details><summary>Show what you submitted</summary>${summary}</details></div>`;
    openFound=true;
    const val=k=> rec&&rec.data ? esc(rec.data[k]||'') : '';
    const fields=m.fields.map(([k,type,label,sub])=>{
      const id=`${m.id}_${k}`;
      const input = type==='area' ? `<textarea id="${id}" name="${k}">${val(k)}</textarea>` : `<input type="text" id="${id}" name="${k}" value="${val(k)}">`;
      return `<label for="${id}">${label}${sub?`<span class="sub">${sub}</span>`:''}${input}</label>`;
    }).join('');
    const err = msg&&msg.id===m.id ? `<div class="fb bad"><b>Almost.</b> ${msg.text}</div>` : '';
    return `<div class="ms">${head}${fbk}<p class="muted">${m.intro}</p>
      <form id="msForm" data-m="${m.id}" novalidate>${fields}<div><button class="btn primary" type="submit">${st==='changes'?'Resubmit for review':'Submit for review'}</button></div></form>${err}</div>`;
  }).join('');
  const g=gate(n);
  return `<div class="panel stack"><div><span class="eyebrow">Gate 3 of 3 · Project</span><p class="muted">${C[n].live.intro}</p></div>
    <div class="row">${g.live?'<span class="chip good">Project: complete</span>':`<span class="chip warn">${g.liveCount} of ${g.need} approved</span>`}<span class="hint">Work with friends, siblings, a club or a co-op group, or on your own. Ask a parent or mentor to review each milestone in Mentor view.</span></div></div>
    <div class="stack" style="margin-top:16px">${cards}</div>`;
}
function validateMs(m,f){
  const data={};
  for(const [k,,label,,min,rule] of m.fields){
    const v=(f.get(k)||'').toString().trim(); data[k]=v;
    if(words(v)<min) return {err:`Add more to “${label}”. A few more words will do it.`};
    if(rule==='ifthen' && (!/\b(if|when)\b/i.test(v) || !/\b(then|we'll|we’ll|we will|i'll|i’ll|i will)\b/i.test(v))) return {err:'Write the plan as “If ___, then we will ___.”'};
    if(rule==='noluck' && /\b(luck|lucky|easy|fluke|chance)\b/i.test(v)) return {err:'Your credit mentions luck or an easy task. Name what your team did.'};
    if(rule==='inside' && !/\b(we|our|us|i|my|me)\b/i.test(v)) return {err:'Name an obstacle inside your team, something you do, think or feel. Use “we” or “our.”'};
  }
  return {data};
}
function reviewsHTML(){
  const P=proj(); const pending=MILESTONES.filter(m=>P.ms[m.id]&&P.ms[m.id].status==='pending');
  const team = P.ms.m1&&P.ms.m1.data ? esc(P.ms.m1.data.team) : 'Capstone';
  const items = pending.length ? pending.map(m=>{
    const rec=P.ms[m.id];
    const err = T.reviewMsg&&T.reviewMsg.id===m.id ? `<div class="fb bad"><b>Almost.</b> ${T.reviewMsg.text}</div>` : '';
    return `<div class="ms"><div class="mshead"><div><span class="eyebrow">${team} · Milestone ${MILESTONES.indexOf(m)+1}</span><h3>${m.title}</h3></div><span class="chip accent">Submitted ${rec.submitted}</span></div>
      <dl>${m.fields.map(f=>`<dt>${f[2]}</dt><dd>${esc(rec.data[f[0]]||'')}</dd>`).join('')}</dl>
      <label for="fb_${m.id}">Feedback for the team<span class="sub">Required when you ask for changes. Start with something they did well.</span><textarea id="fb_${m.id}"></textarea></label>
      <div class="row"><button class="btn primary" data-action="review" data-id="${m.id}" data-v="approve">Approve</button><button class="btn" data-action="review" data-id="${m.id}" data-v="changes">Ask for changes</button></div>${err}</div>`;
  }).join('') : `<p class="hint">No milestones are waiting for review. When a team submits one, it appears here.</p>`;
  return `<section class="stack" style="margin-top:28px"><div><span class="eyebrow">Capstone reviews</span><h2 style="font-size:22px;margin-top:4px">Waiting for your sign-off</h2></div>${items}</section>`;
}

/* ---- mentor ---- */
function viewMentor(){
  if(!T.mentorOk){
    const err=T.pinMsg?`<div class="fb bad"><b>Almost.</b> ${T.pinMsg}</div>`:'';
    const setting=!S.pin;
    return `<section class="lvlhead"><span class="eyebrow">For parents and mentors</span><h1>Mentor view</h1>
      <p class="muted">See progress at each level and review the final project. ${setting?'Set a 4-digit PIN so only you can approve project milestones.':'Enter your mentor PIN.'}</p></section>
      <div class="panel stack"><form id="pinForm" novalidate>
        <label for="pinInput">${setting?'Choose a 4-digit PIN':'Mentor PIN'}<input type="password" inputmode="numeric" autocomplete="off" maxlength="4" id="pinInput" name="pin"></label>
        <div><button class="btn primary" type="submit">${setting?'Set PIN and continue':'Unlock'}</button></div></form>${err}
        ${setting?'':'<p class="hint">Forgot the PIN? “Reset progress” at the bottom of the page clears it, along with all progress.</p>'}</div>`;
  }
  const rows=LEVELS.map(l=>{
    if(l.n===1) return `<tr><td>1 · ${l.title}</td><td colspan="3">${S.l1?'Read':'Not started'}</td><td class="num">${(S.l1log||[]).length}</td><td>${statusChip(status(1))}</td></tr>`;
    const g=gate(l.n); const L=S.levels[l.n];
    const mark=(ok,best,tot,att)=> ok?`<span class="chip good">Passed${best!=null?` ${best}/${tot}`:''}</span>`: att?`<span class="chip warn">Not yet · ${att} tr${att>1?'ies':'y'}</span>`:'<span class="muted">–</span>';
    const live = g.live?'<span class="chip good">Done</span>':`${g.liveCount}/${g.need}`;
    const entries = l.n===6 ? `${g.liveCount} approved` : L.live.length;
    return `<tr><td>${l.n} · ${l.title}</td><td>${mark(L.know.passed,L.know.best,C[l.n].know.length,L.know.attempts)}</td><td>${mark(L.apply.passed,L.apply.best,C[l.n].apply.items.length,L.apply.attempts)}</td><td class="num">${live}</td><td class="num">${entries}</td><td>${statusChip(status(l.n))}</td></tr>`;
  }).join('');
  return `<section class="lvlhead"><span class="eyebrow">For parents and mentors</span><h1>Mentor view</h1>
    <p class="muted">Progress on this device, level by level.</p></section>
    <div class="stack">
    <div class="tablewrap"><table><thead><tr><th>Level</th><th>Know</th><th>Apply</th><th>Live</th><th>Entries</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="notecard"><span class="eyebrow">Tips for check-ins</span>
      <p>Start with what they <em>have</em> done. If they’re stuck on <b>Know</b>, replay the story together. If it’s <b>Apply</b>, talk through one of the examples. If it’s <b>Live</b>, ask what’s getting in the way of writing entries. Journal entries are personal, so ask before reading them.</p>
      <p>If anything they write worries you, talk with them about it, and reach out to a counselor or doctor if you need to.</p></div>
    <div><button class="btn ghost" data-action="lockMentor">Lock Mentor view</button></div>
    </div>${reviewsHTML()}`;
}

  return `<footer class="foot">
    <div class="row">${T.confirmReset?'<span>Erase all progress on this device?</span><button class="btn" data-action="resetYes">Erase progress</button><button class="btn ghost" data-action="resetNo">Cancel</button>':'<button class="link" data-action="resetAsk">Reset progress</button>'}</div>
    <p>Progress and journal entries are saved only in this browser on this device. Nothing is sent anywhere. If other people use this browser, they can see your entries.</p>
    <p>Plot Twist draws on research by Martin Seligman, Albert Bandura, Gabriele Oettingen, Daphna Oyserman and others. It’s a learning tool, not therapy.</p>
  </footer>`;

/* ---------------- actions ---------------- */
const toTop = () => window.scrollTo({top:0,behavior:'instant'});
const A = {
  nav(d){S.view={name:d.to}; save(); render(); toTop()},
  open(d){const n=+d.level; if(T.banner!==n) T.banner=null; S.view={name:'level', level:n, stage:n>1?firstStage(n):null}; save(); render(); toTop()},
  stage(d){S.view.stage=d.stage; T.banner=null; save(); render(); toTop()},
  catch(d){const st=storyState(S.view.level); if(!st.caught.includes(d.id)) st.caught.push(d.id); render()},
  go(d){const st=storyState(S.view.level); st.scene=d.to; st.path.push(d.to); render(); document.getElementById('scene')?.scrollIntoView({block:'start'})},
  sort(d){const n=S.view.level; const st=storyState(n); const t=C[n].thoughts[d.id]; st.sorted[d.id]={pick:d.trap, ok:t.accept.includes(d.trap)}; render()},
  alt(d){const st=storyState(S.view.level); const i=+d.i; st.altsChecked=false; st.alts = st.alts.includes(i)?st.alts.filter(x=>x!==i):[...st.alts,i]; render()},
  ladderAdd(d){const st=storyState(S.view.level); st.ladderChecked=false; st.ladder.push(+d.i); render()},
  ladderUndo(){const st=storyState(S.view.level); st.ladderChecked=false; st.ladder.pop(); render()},
  ladderCheck(){storyState(S.view.level).ladderChecked=true; render()},
  woopPick(d){const st=storyState(S.view.level); st.woop[+d.s]=+d.o; render()},
  follow(d){const L=S.levels[S.view.level]; const e=L.live.find(x=>String(x.id)===d.id); if(e){e.follow=d.v; save(); render()}},
  l1Done(){S.l1=true; save(); A.open({level:'2'})},
  lockMentor(){T.mentorOk=false; S.view={name:'path'}; render(); toTop()},
  bucket(d){const st=storyState(S.view.level); st.buckets[+d.i]=+d.c; render()},
  review(d){
    const P=proj(); const rec=P.ms[d.id]; if(!rec) return;
    const el=document.getElementById('fb_'+d.id); const text=el?el.value.trim():'';
    if(d.v==='changes' && words(text)<3){T.reviewMsg={id:d.id,text:'Add a short note so the team knows what to change.'}; render(); return}
    rec.status = d.v==='approve'?'approved':'changes'; rec.feedback=text; rec.reviewed=today(); T.reviewMsg=null;
    checkCleared(6); save(); render();
  },
  ask(d){const st=storyState(S.view.level); st.ask[st.scene]=+d.i; render()},
  mcPick(d){
    const n=S.view.level; const st=applyState(n); const it=C[n].apply.items[st.order[st.i]];
    st.pick=+d.o; const ok=it.a.includes(+d.o); st.results[st.i]=ok;
    if(!ok){const m=S.levels[n].apply.misses; m[it.cat]=(m[it.cat]||0)+1; save()}
    render();
  },
  altCheck(){storyState(S.view.level).altsChecked=true; render()},
  finishStory(){const n=S.view.level; S.levels[n].story=true; S.view.stage='real'; save(); render(); toTop()},
  replayStory(){delete T.story[S.view.level]; render(); toTop()},
  realAns(d){T.real[S.view.level]=+d.i; render()},
  finishReal(){const n=S.view.level; S.levels[n].real=true; S.view.stage='know'; save(); render(); toTop()},
  knowAns(d){knowState(S.view.level).answers[+d.q]=+d.o; render()},
  knowSubmit(){
    const n=S.view.level; const st=knowState(n); const L=S.levels[n];
    const score=C[n].know.filter((q,i)=>st.answers[i]===q.a).length;
    st.submitted=true; L.know.attempts++; L.know.best=Math.max(L.know.best,score);
    if(score>=4) L.know.passed=true;
    checkCleared(n); save(); render();
  },
  knowRetry(){knowState(S.view.level,true); render(); toTop()},
  knowRetake(){const st=knowState(S.view.level,true); st.retake=true; render()},
  trapPick(d){
    const n=S.view.level; const st=applyState(n); const it=C[n].apply.items[st.order[st.i]];
    st.pick=d.k; const ok=it.a.includes(d.k); st.results[st.i]=ok;
    if(!ok){const m=S.levels[n].apply.misses; m[it.a[0]]=(m[it.a[0]]||0)+1; save()}
    render();
  },
  dispToggle(d){const st=applyState(S.view.level); const s=+d.s; st.sel=st.sel.includes(s)?st.sel.filter(x=>x!==s):[...st.sel,s]; render()},
  dispCheck(){const n=S.view.level; const st=applyState(n); const it=C[n].apply.items[st.order[st.i]]; st.checked=true; st.results[st.i]=evalDispute(it,st.sel).ok; render()},
  applyNext(){
    const n=S.view.level; const st=applyState(n); const A_=C[n].apply; const L=S.levels[n];
    st.pick=null; st.sel=[]; st.checked=false;
    if(st.i+1<A_.items.length){st.i++}
    else{
      st.done=true; const score=st.results.filter(Boolean).length;
      L.apply.attempts++; L.apply.best=Math.max(L.apply.best,score);
      if(score>=A_.pass) L.apply.passed=true;
      checkCleared(n); save();
    }
    render(); toTop();
  },
  applyRetry(){const n=S.view.level; S.levels[n].apply.misses={}; applyState(n,true); save(); render(); toTop()},
  coach(){const el=document.getElementById('coachText'); T.coach=coachCheck(el?el.value:''); render(); document.getElementById('coachText')?.scrollIntoView({block:'center'})},
  delEntry(d){const n=S.view.level; const L=S.levels[n]; L.live=L.live.filter(e=>String(e.id)!==d.id); T.liveMsg=null; save(); render()},
  resetAsk(){T.confirmReset=true; render()},
  resetNo(){T.confirmReset=false; render()},
  resetYes(){S=fresh(); for(const k of ['story','real','know','apply']) T[k]={}; T.confirmReset=false; T.banner=null; T.coach=null; T.liveMsg=null; T.msMsg=null; T.reviewMsg=null; T.mentorOk=false; T.pinMsg=null; T.l1Msg=null; save(); render(); toTop()}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]'); if(!b||b.disabled) return;
  const f=A[b.dataset.action]; if(f){e.preventDefault(); f(b.dataset)}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='pinForm'){
    e.preventDefault();
    const v=(new FormData(e.target).get('pin')||'').toString().trim();
    if(!/^\d{4}$/.test(v)){T.pinMsg='The PIN needs exactly 4 digits.'; render(); return}
    if(!S.pin){S.pin=v; save()}
    else if(v!==S.pin){T.pinMsg='That PIN doesn’t match. Try again.'; render(); return}
    T.mentorOk=true; T.pinMsg=null; render(); return;
  }
  if(e.target.id==='l1Form'){
    e.preventDefault();
    const fd=new FormData(e.target); const did=(fd.get('did')||'').toString().trim(), eff=(fd.get('eff')||'').toString().trim();
    if(words(did)<2||words(eff)<2){T.l1Msg={ok:false,text:'Write a few words in both boxes.'}; render(); const a=document.getElementById('l1_did'), b=document.getElementById('l1_eff'); if(a) a.value=did; if(b) b.value=eff; return}
    S.l1log=S.l1log||[]; S.l1log.push({day:today(), did, eff}); T.l1Msg={ok:true,text:'Your action changed something. Notice that.'}; save(); render(); return;
  }
  if(e.target.id==='msForm'){
    e.preventDefault();
    const m=MILESTONES.find(x=>x.id===e.target.dataset.m); const fd=new FormData(e.target); const r=validateMs(m,fd);
    if(r.err){
      const vals=Object.fromEntries(fd); T.msMsg={id:m.id,text:r.err}; render();
      for(const [k,v] of Object.entries(vals)){const el=document.getElementById(`${m.id}_${k}`); if(el) el.value=v}
      return;
    }
    const P=proj(); const prev=P.ms[m.id]||{};
    P.ms[m.id]={data:r.data, status:'pending', submitted:today(), feedback:prev.feedback||''}; T.msMsg=null; save(); render(); return;
  }
  if(e.target.id!=='liveForm') return;
  e.preventDefault();
  const n=+e.target.dataset.level; const r=validateLive(n,new FormData(e.target));
  if(r.err){
    const vals=Object.fromEntries(new FormData(e.target)); T.liveMsg={n,ok:false,text:r.err}; render();
    for(const [k,v] of Object.entries(vals)){const el=document.querySelector(`#liveForm [name="${k}"]`); if(el) el.value=v}
    return;
  }
  S.levels[n].live.push(r.entry);
  const g=gate(n);
  T.liveMsg={n,ok:true,text: g.live?'That’s the third one. Live gate cleared.':`${g.liveCount} of 3 toward the Live gate.`};
  checkCleared(n); save(); render();
});
document.addEventListener('change',e=>{
});
render();
