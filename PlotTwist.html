<title>Plot Twist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one reading column, like a book. Path = table of contents, each level = a chapter with five stages. Thoughts are marigold bubbles. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --sunken:#E7E9F2; --ink:#171A2C; --muted:#585D7A; --line:#D6D9E6;
  --accent:#3044D0; --accent-ink:#FFFFFF; --accent-soft:#E2E6FF;
  --thought:#FFD36B; --thought-ink:#33260A;
  --good:#1C7A51; --good-soft:#DCF2E6; --warn:#8F5400; --warn-soft:#FBEACB; --bad:#B0361B; --bad-soft:#FADFD7;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-story:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121C; --surface:#191C2B; --sunken:#23273A; --ink:#E8E9F2; --muted:#A3A7C2; --line:#30344C;
  --accent:#95A2FF; --accent-ink:#10121C; --accent-soft:#272D57;
  --thought:#EBBB4B; --thought-ink:#231904;
  --good:#62D3A0; --good-soft:#163428; --warn:#F1B65B; --warn-soft:#3A2C12; --bad:#FF8C6E; --bad-soft:#3D1F17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121C; --surface:#191C2B; --sunken:#23273A; --ink:#E8E9F2; --muted:#A3A7C2; --line:#30344C;
  --accent:#95A2FF; --accent-ink:#10121C; --accent-soft:#272D57;
  --thought:#EBBB4B; --thought-ink:#231904;
  --good:#62D3A0; --good-soft:#163428; --warn:#F1B65B; --warn-soft:#3A2C12; --bad:#FF8C6E; --bad-soft:#3D1F17;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.brand b span{display:inline-block;transform:rotate(-6deg) translateY(-1px);color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.link{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:700;padding:0}

/* hero */
.hero{display:grid;gap:12px;margin-bottom:32px}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.025em}
.hero p{font-size:18px;color:var(--muted);max-width:58ch}

/* chapters (path) */
.chapters{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.chapter{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line)}
.chapter .num{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--muted);line-height:1;text-align:center}
.chapter.active .num{color:var(--accent)}
.chapter.locked{opacity:.55}
.chapter h3{font-size:20px;font-weight:600}
.chapter .info{min-width:0;display:grid;gap:6px}
@media (max-width:560px){.chapter{grid-template-columns:40px 1fr}.chapter .go{grid-column:2}.chapter .num{font-size:26px}}

/* chips & gate */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.gate{display:flex;gap:6px;flex-wrap:wrap}
.gate .g{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.gate .g i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.gate .g.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.gate .g.ok i{background:var(--good);border-color:var(--good)}
.gate .g.part i{background:conic-gradient(var(--warn) calc(var(--p)*1%),transparent 0);border-color:var(--warn)}

/* level header + stepper */
.back{margin-bottom:14px}
.lvlhead{display:grid;gap:10px;margin-bottom:20px}
.lvlhead h1{font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.02em}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px;scrollbar-width:thin}
.stepper button{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px}
.stepper button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--sunken);color:var(--muted)}
.stepper button.done .n{background:var(--good);color:var(--surface)}
.stepper button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stepper button[disabled]{opacity:.45;cursor:not-allowed}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
@media (max-width:480px){.panel{padding:18px 16px}}
.banner{display:grid;gap:8px;padding:16px 18px;border-radius:12px}
.banner.good{background:var(--good-soft)}
.banner.good h3{color:var(--good)}
.banner.warn{background:var(--warn-soft)}
.banner.warn h3{color:var(--warn)}
.banner h3{font-size:18px}

/* story */
.scene{display:grid;gap:18px}
.scene .when{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--accent);letter-spacing:.01em}
.prose{font-family:var(--f-story);font-size:18.5px;line-height:1.7;display:grid;gap:14px;max-width:62ch}
.prose em{font-style:italic}
.prose .text{font-family:var(--f-ui);font-size:15px;background:var(--sunken);padding:8px 12px;border-radius:14px 14px 14px 4px;display:inline-block;max-width:100%}
.thoughts{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding-left:4px}
.thought{position:relative;border:0;background:var(--thought);color:var(--thought-ink);font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.3;padding:12px 18px;border-radius:22px 22px 22px 6px;text-align:left;max-width:100%;box-shadow:0 2px 0 color-mix(in srgb,var(--thought-ink) 25%,transparent)}
button.thought{cursor:pointer;transform:rotate(-1deg);animation:bob 2.4s ease-in-out infinite}
button.thought:nth-child(2){transform:rotate(1deg);animation-delay:.6s}
.thought.caught{animation:none;transform:none;outline:2px dashed var(--thought-ink);outline-offset:3px}
.thought .tag{display:block;font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
@keyframes bob{50%{translate:0 -3px}}
@media (prefers-reduced-motion:reduce){button.thought{animation:none}}
.hint{font-size:14px;color:var(--muted)}
.choices{display:grid;gap:10px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:var(--f-story);font-size:17px}
.choice:hover{border-color:var(--accent)}
.choice small{display:block;font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.say{font-family:var(--f-story)}
.abc{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
.abc div{background:var(--sunken);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;min-width:0}
.abc b{font-family:var(--f-display);font-size:22px;color:var(--accent)}
.abc span{font-size:14px}
.abc .arr{background:none;padding:0;display:grid;place-items:center;color:var(--muted);font-size:20px}
@media (max-width:560px){.abc{grid-template-columns:1fr}.abc .arr{transform:rotate(90deg)}}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.legend div{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;min-width:0}
.legend b{font-family:var(--f-display);font-size:16px}
.legend span{font-size:14px;color:var(--muted)}
@media (max-width:600px){.legend{grid-template-columns:1fr}}
.sortrow{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{font-size:15px;padding:10px 12px;border-radius:10px}
.fb.good{background:var(--good-soft);color:var(--ink)}
.fb.bad{background:var(--bad-soft);color:var(--ink)}
.fb b{font-weight:700}
.fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}
.notecard{background:var(--sunken);border-radius:12px;padding:16px;display:grid;gap:8px;font-size:15px}
.notecard dt{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.notecard dd{margin:0 0 6px}

.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:6px}
.ladder li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.ladder li b{font-family:var(--f-display);font-size:18px;color:var(--accent);text-align:center}
.ladder.empty{border:2px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:14px;text-align:center;display:block}
.ms{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px;display:grid;gap:12px}
.ms.locked{opacity:.55}
.ms .mshead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ms h3{font-size:18px;font-weight:600}
.ms dl{margin:0;display:grid;gap:4px;font-size:14px}
.ms dt{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ms dd{margin:0 0 6px}
details summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px}
/* real story */
.clip{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:26px 24px;display:grid;gap:16px;position:relative;box-shadow:6px 6px 0 var(--sunken)}
@media (max-width:480px){.clip{padding:20px 16px}}
.clip h2{font-size:clamp(24px,4.5vw,32px);font-weight:800;letter-spacing:-.02em}
.versus{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.versus>div{display:grid;gap:8px;align-content:start;min-width:0}
@media (max-width:560px){.versus{grid-template-columns:1fr}}
.source{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}

/* quiz */
.q{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q .qt{font-weight:700;font-size:17px}
.q .ans{display:grid;gap:8px}
.ans button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.ans button:hover:not([disabled]){border-color:var(--accent)}
.ans button .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.ans button.sel{border-color:var(--accent);background:var(--accent-soft)}
.ans button.sel .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.ans button.right{border-color:var(--good);background:var(--good-soft)}
.ans button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans button[disabled]{cursor:default}
.score{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

/* apply */
.progress{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.stmt{display:grid;gap:8px}
.stmt button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.stmt button .box{flex:0 0 18px;height:18px;border-radius:5px;border:2px solid var(--line);margin-top:2px}
.stmt button.sel{border-color:var(--accent);background:var(--accent-soft)}
.stmt button.sel .box{background:var(--accent);border-color:var(--accent)}
.stmt button .lbl{display:flex;gap:10px;align-items:flex-start;min-width:0}
.stmt button[disabled]{cursor:default}

/* forms */
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:14px}
label .sub{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],textarea,select{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.entries{display:grid;gap:10px}
.entry{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;font-size:15px}
.entry .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.entry q{font-family:var(--f-display);font-weight:600;quotes:"\201C" "\201D"}

/* mentor */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
tr.you td{background:var(--accent-soft)}
.dots{display:inline-flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* footer */
.foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:12px;font-size:14px;color:var(--muted)}
.foot label{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px}
</style>

<div class="wrap" id="app"></div>

<script>
/* ---------------- content ---------------- */
const TRAPS = {
  permanent:{name:'Permanent', line:'“It will always be this way.”', cue:'always, never, forever, all year',
    tip:'Listen for time words: always, never, forever, all year. Ask yourself: will this really last?'},
  pervasive:{name:'Pervasive', line:'“It ruins everything.”', cue:'one bad thing spreads to your whole life',
    tip:'Watch for one event spreading: everything, whole, my life. Ask: what part of my life does this actually touch?'},
  personal:{name:'Personal', line:'“It’s because of who I am.”', cue:'labels like stupid, lazy, boring',
    tip:'Notice labels about who you are (stupid, lazy, boring). Compare them with something you did, which can change.'},
  none:{name:'No trap', line:'Balanced', cue:'specific, temporary, with a plan',
    tip:'Some thoughts are already balanced: specific, temporary, with a next step. Not every thought is a trap.'}
};

const LEVELS = [
  {n:1, title:'Noticing control', skill:'See where your actions change what happens.'},
  {n:2, title:'Catching thoughts', skill:'Notice the thoughts that turn one event into a whole story.'},
  {n:3, title:'Talking back', skill:'Check your thoughts against the evidence.'},
  {n:4, title:'Building wins', skill:'Set step-by-step goals and give yourself credit.'},
  {n:5, title:'Future me', skill:'Picture who you could become and plan around obstacles.'},
  {n:6, title:'Make something change', skill:'Lead a real project that changes something at school.'}
];

const STAGES = [['story','Story'],['real','Real story'],['know','Know'],['apply','Apply'],['live','Live']];

const C = {
2:{
  story:{start:'s1', scenes:{
    s1:{when:'Week 3 · Biology, 2:47 p.m.', paras:[
      'Ms. Reyes walks the rows, laying tests face-down on each desk. Nia Okafor waits until she’s gone before she flips hers over.',
      '<b>58.</b> Circled in red. Under it, in small letters: <em>See me if you want to talk.</em>',
      'Around her, chairs scrape. Someone behind her says “easy” to nobody in particular. Nia slides the paper into her binder fast, like the number might leak out.',
      'A thought shows up before she’s even zipped her bag.'],
      thoughts:['t1'], hint:'Tap the thought to catch it. Thoughts like this arrive fast and sound like facts. Most people never notice them.', next:'s2'},
    s2:{when:'Lunch, the next day', paras:[
      'Nia’s phone buzzes. It’s the group chat Amara made in the first week of school. Fourteen new messages.',
      'She scrolls. Amara and Jess are planning a movie on Saturday. Theo is in. Priya is in. There’s a poll for showtimes. Nobody has tagged her.',
      '<span class="text">Amara: ok 7:15 wins. who’s driving??</span>',
      'She reads it twice, then puts the phone face-down, the same way the test was.'],
      thoughts:['t2','t3'], hint:'Two thoughts this time. Catch both.', next:'s3'},
    s3:{when:'That night, 9:30 p.m.', paras:[
      'Her biology notes are open on the bed. The chapter 4 test is next week. She stares at the first diagram for a while, then closes the notebook.',
      'She doesn’t decide to stop studying. It just sort of happens.'],
      thoughts:['t4'], hint:'One more.', next:'s4'},
    s4:{when:'Your turn', interactive:'sort', next:'s5'},
    s5:{when:'What actually happened', paras:[
      'Look at the timeline again. A test came back with a 58. A group chat made plans. Those were two events, on two days.',
      'Nia’s thoughts turned them into a story: she’s not a science person, she’s boring, it will always be like this, she’s bad at everything. Then that story decided what she did on Monday night.'],
      abc:['A · Adversity','A 58 on the first biology test','B · Belief','“I’m just not a science person.”','C · Consequence','She closes the notebook and stops studying'],
      after:['The 58 didn’t stop Nia from studying. The thought did.','That’s why catching thoughts comes first. You can’t argue with a thought you haven’t noticed.'],
      end:true}
  }},
  thoughts:{
    t1:{text:'I’m just not a science person.', accept:['permanent','personal'],
      why:'“Just not a science person” describes something fixed about who Nia is. It turns one test into a permanent trait.'},
    t2:{text:'It’s because I’m boring. Of course they didn’t invite me.', accept:['personal'],
      why:'Nia blames who she is (“I’m boring”) without checking for any other reason.'},
    t3:{text:'It’s always going to be like this here.', accept:['permanent'],
      why:'“Always” stretches one week into forever.'},
    t4:{text:'I’m bad at everything at this school anyway. What’s the point?', accept:['pervasive'],
      why:'One test and one group chat spread to “everything at this school.”'}
  },
  real:{
    where:'Real story · Wilmington, North Carolina, 1978', title:'The list without his name',
    paras:[
      'Michael Jordan was a 15-year-old sophomore at Laney High School when the varsity basketball roster went up. He looked for his name and didn’t find it. He was placed on the junior varsity team, and the last varsity spot went to a taller classmate.',
      'Jordan has said he went home, shut himself in his room and cried.',
      'The same event could have produced two very different thoughts:'],
    versus:[['The trap','I’m not good enough, and I never will be.'],['What he did instead','I’m not on varsity this year. I’ll work so they can’t leave me off next time.']],
    after:[
      'He spent that season on JV and practiced hard. He made varsity the next year, and he also grew several inches, which helped.',
      'Getting cut still hurt. What changed things was the story he told himself about it.'],
    source:'Based on Jordan’s own accounts in interviews over the years; details simplified for teaching.',
    q:'The thought “I’m not good enough, and I never will be” falls mostly into which trap?',
    opts:[['Permanent','“Never will be” turns one season into forever. Jordan’s version kept it to “this year.”',true],
          ['Pervasive','Not quite. The thought stays about basketball. The loudest part is “never will be,” which makes it permanent.',false],
          ['Personal','It does have a personal side (“I’m not good enough”), but the loudest words are “never will be.” That’s the permanent trap.',true]]
  },
  know:[
    {q:'Nia thinks: “I’ll never be good at science.” Which word gives away the Permanent trap?',
     o:['never','good','science','I’ll'], a:0, why:'“Never” makes a temporary problem sound like it will last forever.'},
    {q:'Which thought shows the Pervasive trap?',
     o:['I bombed this quiz.','I bombed this quiz, so this whole year is ruined.','I bombed this quiz because I studied the wrong pages.','I’ll ask about the quiz tomorrow.'], a:1,
     why:'Pervasive thoughts let one event spread to everything, like “this whole year.”'},
    {q:'Which of these is a Personal trap (blaming who you are)?',
     o:['We lost because I’m a loser.','We lost because I missed two free throws.','We lost because the other team is undefeated.','We lost this one.'], a:0,
     why:'“I’m a loser” labels who you are. Missing free throws is something you did, and that can change with practice.'},
    {q:'In the ABC model, what most directly shapes how you feel and act after something bad happens?',
     o:['The event itself','What you believe about the event','How other people react','Luck'], a:1,
     why:'A (the event) leads to B (your belief about it), and B drives C (how you feel and act).'},
    {q:'Which is the most accurate rewrite of “I’m not a math person”?',
     o:['I’m a genius at math.','Math doesn’t matter anyway.','I haven’t figured out this unit yet, and I can get help with it.','Nobody is a math person.'], a:2,
     why:'The goal is an accurate thought, not just a happy one: specific (“this unit”), temporary (“yet”) and with a next step.'}
  ],
  recap:{title:'Nia’s cheat sheet: the three traps', items:[
    ['Permanent','“It’s always going to be like this.” Listen for always, never, forever.'],
    ['Pervasive','“I’m bad at everything.” One event spreads to your whole life.'],
    ['Personal','“It’s because I’m boring.” A label about who you are instead of what happened.']]},
  apply:{type:'trap', pass:6, items:[
    {ctx:'After a confusing first lab', t:'Chemistry is going to be impossible for me all year.', a:['permanent'],
     why:'“All year” takes one confusing lab and makes it last the whole year.'},
    {ctx:'After the winter band concert', t:'I messed up one note, so the whole night was a disaster and I’m bad at everything.', a:['pervasive'],
     why:'One note spreads to “the whole night” and then to “everything.”'},
    {ctx:'After a team debate round', t:'We lost the debate and it’s 100% my fault. I’m the reason we lose.', a:['personal'],
     why:'This takes all the blame for a team result and makes it about who you are (“I’m the reason”).'},
    {ctx:'After a history test', t:'I bombed the first test. I studied the wrong chapters, so I’ll check the study guide next time.', a:['none'],
     why:'This one is balanced: a specific reason that can change, plus a plan.'},
    {ctx:'After an unanswered text', t:'My friend didn’t text back. She’s going to ignore me forever now.', a:['permanent'],
     why:'“Forever” turns a few hours of silence into something permanent.'},
    {ctx:'After a Spanish quiz', t:'I got a bad grade in Spanish, so I’m a failure as a person.', a:['pervasive','personal'],
     why:'A grade in one class spreads to your whole self. That’s pervasive, with a personal edge too.'},
    {ctx:'After a group project grade', t:'The group project failed because I’m lazy and useless.', a:['personal'],
     why:'“Lazy and useless” labels who you are instead of naming something you did that could change.'},
    {ctx:'After the fall play cast list', t:'I didn’t get a part. The director picked mostly seniors this year, and I’ll audition again in spring.', a:['none'],
     why:'Balanced: a reason tied to the situation (“this year”) and a next step.'}
  ]},
  live:{type:'catch', intro:'Over the next few days, catch real thoughts from your own life. Write them down the way they sounded in your head.'}
},
3:{
  story:{start:'s1', scenes:{
    s1:{when:'Saturday, 10:15 a.m.', paras:[
      'Nia’s cousin Dev is a junior. He’s come over to borrow her dad’s ladder, and he finds her on the couch in pajamas, not watching the show that’s on.',
      '<span class="say">“You look like someone deleted your save file,” he says.</span>',
      'She tells him about the 58. She doesn’t mention the group chat.',
      'Dev drops onto the other end of the couch. <span class="say">“Okay. Detective time. Your theory is <em>I’m not a science person.</em> What’s the evidence?”</span>'],
      choices:[['What Nia says','“I got a 58. That’s the evidence.”','s1a'],['What Nia says','“I mean… I got a B+ in science last year.”','s1b']]},
    s1a:{when:'Saturday, 10:17 a.m.', paras:[
      '<span class="say">“That’s one clue,” Dev says. “A detective doesn’t close the case on one clue. What else is in the file?”</span>',
      'Nia thinks about it. Last year she got a B+ in science. She studied for this test for one night. And she studied chapters 1 and 2, but half the test was on chapter 3.',
      '<span class="say">“So the file says: B+ last year, one night of studying, wrong chapter,” Dev says. “Does that sound like someone who can’t do science?”</span>'], next:'s2'},
    s1b:{when:'Saturday, 10:17 a.m.', paras:[
      '<span class="say">“Interesting,” Dev says. “That doesn’t fit your theory at all. What else is in the file?”</span>',
      'She studied for one night. And she studied chapters 1 and 2, but half the test was on chapter 3.',
      '<span class="say">“So the file says: B+ last year, one night of studying, wrong chapter,” Dev says. “Does that sound like someone who can’t do science?”</span>'], next:'s2'},
    s2:{when:'Other explanations', interactive:'alts', next:'s3'},
    s3:{when:'Saturday, 11:02 a.m.', paras:[
      'Then Nia tells him about the group chat. The movie. The poll. Nobody tagging her. <span class="say">“They obviously don’t want me there.”</span>',
      'Dev shrugs. <span class="say">“Maybe. That’s a theory too. How would you test it?”</span>',
      'Nia’s phone is in her hand. What does she do?'],
      choices:[['Choice','Leave the group chat. If they don’t want her there, fine.','s3a'],
               ['Choice','Message Amara directly and ask about Saturday.','s3b'],
               ['Choice','Do nothing. She already knows the answer.','s3c']]},
    s3a:{when:'Plot twist', paras:[
      'Nia taps <em>Leave group</em>. It feels good for about four seconds.',
      '<span class="text">Amara: wait why did you leave?? are you ok</span>',
      'Now there’s an awkward conversation to have, and Nia still doesn’t know why she wasn’t tagged. She acted on the theory before she checked it.',
      '<span class="say">“You treated a guess like a fact,” Dev says. “Want to rewind?”</span>'],
      choices:[['Rewrite the scene','Rewind and try a different move','s3']]},
    s3c:{when:'Plot twist', paras:[
      'Nia puts the phone down. Saturday night she scrolls through Priya’s story: popcorn, the theater lobby, everyone laughing.',
      'It feels like proof. But nothing was tested. The theory just sat there, getting heavier.',
      '<span class="say">“A theory you never test always feels true,” Dev says. “Rewind?”</span>'],
      choices:[['Rewrite the scene','Rewind and try a different move','s3']]},
    s3b:{when:'Saturday, 11:06 a.m.', paras:[
      'Nia types, deletes, types again.',
      '<span class="text">Nia: hey are you guys doing the movie sat? I’d be down if there’s room</span>',
      '<span class="text">Amara: OMG yes!! we thought you had your brother’s game?? you said that last week. come!!</span>',
      'Nia scrolls back. She did say that. Last Tuesday.',
      '<span class="say">“So the evidence says they thought you were busy,” Dev says, picking up the ladder. “Case closed.”</span>'], next:'s4'},
    s4:{when:'Monday, 7:52 a.m.', paras:[
      'Before first period, Nia opens the notes app on her phone and writes it down the way Dev showed her.'],
      note:[['The thought','“I’m just not a science person.”'],['Evidence','B+ last year. Studied for one night. Half the test was on a chapter I skipped.'],['Another explanation','New teacher, new kind of test, wrong chapter.'],['Next step','Ask Ms. Reyes what the chapter 4 test will cover.']],
      after:['At lunch, she knocks on Ms. Reyes’s door.','Disputing a thought isn’t telling yourself you’re amazing. It’s checking whether the thought is telling you the truth, then acting on what’s true.'],
      end:true}
  }},
  alts:{prompt:'Dev grabs a pen and an old receipt. “Now give me other explanations for the 58. Pick every one that actually fits the evidence.”',
    opts:[
      ['She studied the wrong chapters.',true,'Fits: half the test was on chapter 3.'],
      ['It was her first test with a new teacher, and she didn’t know what Ms. Reyes’s tests look like yet.',true,'Fits: it was week 3 at a new school.'],
      ['One night of studying wasn’t enough for this test.',true,'Fits: she only studied the night before.'],
      ['She just isn’t smart.',false,'Doesn’t fit: a B+ last year says otherwise.'],
      ['Ms. Reyes doesn’t like her.',false,'No evidence for this. Ms. Reyes actually offered to talk.']],
    miss:'Check each option against the evidence: B+ last year, one night of studying, the wrong chapter. Change your picks and check again.',
    after:'“Three explanations that fit,” Dev says, “and every one is something you can change.”'},
  real:{
    where:'Real story · Edinburgh, 1995', title:'Twelve rejections',
    paras:[
      'J.K. Rowling was a single mother living on welfare benefits in Edinburgh when she finished the manuscript of <em>Harry Potter and the Philosopher’s Stone</em>. Her literary agent sent it to publishers.',
      'About a dozen of them turned it down. In 1996, Bloomsbury, a London publisher, finally said yes and printed a small first run of 500 copies.',
      'Imagine being in her position after rejection number eight. The easiest thought to have is: <em>My writing isn’t good enough. I’ve wasted years.</em>',
      'Now look at what the evidence actually showed:'],
    list:[
      'Each rejection was one editor’s opinion of one book, not a verdict on her as a writer.',
      'Many publishers at the time thought long children’s books wouldn’t sell. That’s a reason about the market, not about her.',
      'Her agent had read the whole manuscript and chose to represent it.'],
    after:['She has since talked often about rejection and failure as part of her story.'],
    source:'Based on widely reported accounts; details simplified for teaching.',
    q:'Which response is the strongest dispute of “My writing isn’t good enough”?',
    opts:[['My writing is the best in the world.','That’s positive, but there’s no evidence in it. Disputing is about accuracy.',false],
          ['Each rejection is one editor’s opinion of one book, and my agent believes in it. I’ll keep submitting.','Evidence, another explanation and a next step. That’s a full dispute.',true],
          ['Publishers are all idiots.','That swaps one unchecked theory for another. Blame isn’t evidence.',false],
          ['They’re right. I should stop.','This agrees with the trap instead of checking it.',false]]
  },
  know:[
    {q:'What’s the first question to ask when you dispute a thought?',
     o:['How do I make this feeling go away?','What’s the evidence that this thought is true?','Who can I blame?','How do I stop thinking about it?'], a:1,
     why:'Disputing starts by treating the thought as a theory and checking the evidence.'},
    {q:'Nia’s thought is “Ms. Reyes thinks I’m stupid.” Which of these is evidence, not a feeling?',
     o:['I feel like she’s annoyed with me.','She wrote “See me if you want to talk” on my test.','Teachers always like the smart kids more.','I just know it.'], a:1,
     why:'Evidence is something you could show someone else. Feelings and hunches aren’t evidence.'},
    {q:'Your friend walks past you in the hallway without saying hi. Which is an alternative explanation?',
     o:['She hates me now.','She might not have seen me. She looked like she was rushing to class.','Everyone is turning against me.','I’m unlikeable.'], a:1,
     why:'An alternative explanation is another reason that fits the facts, often about the situation rather than about you.'},
    {q:'What’s the difference between disputing and “positive thinking”?',
     o:['There’s no difference.','Disputing aims for accurate thoughts, not just happy ones.','Disputing means ignoring bad events.','Positive thinking uses more evidence.'], a:1,
     why:'Disputing can land on “yes, part of this is true, and here’s what I’ll do.” Accuracy is the goal.'},
    {q:'In the group chat story, what was Nia’s strongest move?',
     o:['Leave the chat to protect herself','Test the theory by asking Amara directly','Wait and see if anyone noticed','Complain to Dev about her friends'], a:1,
     why:'Asking directly turned a guess into evidence.'}
  ],
  recap:{title:'Dev’s three detective questions', items:[
    ['Evidence','What are the facts for and against this thought? Things you could show someone.'],
    ['Other explanations','What else could explain what happened? Pick the ones that fit the facts.'],
    ['Next step','Given what’s true, what will I do now?']]},
  apply:{type:'dispute', pass:3, items:[
    {who:'Marcus, 9th grade', t:'I got a C on my essay. I’m a terrible writer.', s:[
      ['I got a B on my last two essays.','evidence'],
      ['This was a new kind of essay (an argument essay) that I hadn’t practiced.','alternative'],
      ['I’ll go to the writing center before the next one.','action'],
      ['Grades don’t matter anyway.','weak'],
      ['I’m the best writer in the class, no question.','weak'],
      ['Yeah, I’ll probably fail English.','weak']]},
    {who:'Lena, 9th grade', t:'I wasn’t picked as robotics team lead. Nobody respects me.', s:[
      ['Two people asked me for help with the code last week.','evidence'],
      ['The captain picked a senior, and seniors usually lead.','alternative'],
      ['I’ll ask the captain what skills a lead needs.','action'],
      ['Robotics is dumb anyway.','weak'],
      ['Everyone thinks I’m a genius.','weak'],
      ['They probably all laugh at me.','weak']]},
    {who:'Sam, 9th grade', t:'My mom yelled at me this morning. I ruin everything at home.', s:[
      ['Last night we watched a show together and laughed.','evidence'],
      ['She has a big deadline at work this week and has been stressed.','alternative'],
      ['Tonight I’ll ask her if something’s wrong and help with dinner.','action'],
      ['Whatever, I don’t care what she thinks.','weak'],
      ['I’m the perfect kid, so it’s all her fault.','weak'],
      ['I always make everyone miserable.','weak']]},
    {who:'Jaylen, 9th grade', t:'I froze during my presentation. Everyone thinks I’m a joke now.', s:[
      ['Only one person laughed, and that was when the slide didn’t load.','evidence'],
      ['I didn’t rehearse out loud, so I wasn’t ready for the nerves.','alternative'],
      ['Next time I’ll practice twice in front of my brother.','action'],
      ['Presentations are pointless.','weak'],
      ['I was actually amazing and nobody noticed.','weak'],
      ['I’ll never be able to talk in front of people.','weak']]}
  ]},
  live:{type:'dispute', intro:'When a trap thought shows up in your own life, talk back to it. Use Dev’s three questions.'}

4:{
  story:{start:'s1', scenes:{
    s1:{when:'Week 7 · Ms. Reyes’s room, lunch', paras:[
      'Nia got a 72 on the chapter 4 test. Not great, but fourteen points higher than the 58. Ms. Reyes circled it and wrote: <em>Big jump. What changed?</em>',
      'Now it’s lunch and Nia is back in Ms. Reyes’s room. The chapter 5 unit test is in three weeks.',
      '<span class="say">“So what’s your goal?” Ms. Reyes asks.</span>',
      '<span class="say">“Get an A in biology,” Nia says.</span>',
      '<span class="say">“That’s a destination,” Ms. Reyes says. “I want the ladder. What’s the first rung, something you could do tonight? And then the next one?”</span>'],
      interactive:'ladder', next:'s2'},
    s2:{when:'Week 8 · School library, 3:20 p.m.', paras:[
      'Rung three is harder than it looked. Section 5.2 is cellular respiration, and Nia has read the same page four times.',
      'Priya drops into the chair next to her. She’s in tenth grade and tutors in the library on Tuesdays.',
      '<span class="say">“Respiration?” Priya says. “I failed my first bio test last year. Like, a 49.”</span>',
      'Nia looks up. Priya <em>tutors biology</em>.',
      '<span class="say">“I started drawing everything as a flow chart. Glucose in, energy out. Want me to show you?”</span>'],
      ask:{q:'Why does Priya’s story help Nia more than a pep talk would?', opts:[
        ['Because Priya is a genius at biology.',false,'Priya got a 49 last year. She isn’t a genius, and she still figured it out. That’s why her story helps.'],
        ['Because Priya was in the same spot and found a method that worked.',true,'Yes. Seeing someone like you succeed is one of the strongest ways to believe you can too. Psychologists call it vicarious experience.'],
        ['Because Priya said biology is easy.',false,'She didn’t say that. She said she failed first, then found a method.']]},
      next:'s3'},
    s3:{when:'Week 9 · Test day, 8:01 a.m.', paras:[
      'Ms. Reyes hands out the unit test. Nia’s heart is pounding. Her hands are damp. Her stomach feels like an elevator dropping.',
      'She has about three seconds to decide what this feeling means.'],
      choices:[['What Nia tells herself','“I’m panicking. I’m going to blank.”','s3a'],
               ['What Nia tells herself','“My body is getting ready. This is energy.”','s3b'],
               ['What Nia tells herself','“Ignore it. Just don’t feel anything.”','s3c']]},
    s3a:{when:'Plot twist', paras:[
      'The word <em>panicking</em> makes her heart beat even faster. She reads question 1 three times and the words slide off the page.',
      'Ten minutes in, she has answered two questions.',
      '<span class="say">Later Priya tells her, “Your body was doing the same thing either way. What changed was the name you gave it.”</span>'],
      choices:[['Rewrite the scene','Rewind and try a different thought','s3']]},
    s3c:{when:'Plot twist', paras:[
      'She tries not to notice her heart. That only makes her notice it more. Every time she starts a question, she checks whether she still feels nervous.',
      'She does.',
      '<span class="say">Later Priya tells her, “Fighting the feeling uses up energy. Using it gives you energy.”</span>'],
      choices:[['Rewrite the scene','Rewind and try a different thought','s3']]},
    s3b:{when:'Week 9 · Test day, 8:02 a.m.', paras:[
      'A pounding heart, damp hands, a dropping stomach: runners feel the same things at the starting line. It’s the body getting ready to perform.',
      'Nia breathes out slowly and turns to question 1. <em>Glucose in, energy out.</em> She can picture Priya’s flow chart.'], next:'s4'},
    s4:{when:'Week 10 · Friday', paras:[
      'The tests come back face-down, like always. This time Nia flips hers over right away.',
      '<b>81.</b> Next to it: <em>You earned this.</em>',
      'Dev texts while she’s on the bus.',
      '<span class="text">Dev: so?? how’d it go</span>',
      'What does Nia tell him?'],
      choices:[['Nia’s reply','“81!! the test was easy this time lol”','s4a'],
               ['Nia’s reply','“81. I think I just got lucky”','s4b'],
               ['Nia’s reply','“81!! the flashcards and the practice test actually worked”','s4c']]},
    s4a:{when:'Plot twist', paras:[
      '<span class="text">Dev: was it easy, or were you ready?</span>',
      'Nia thinks about it. Two people who didn’t study got in the 60s. The test wasn’t easy. She was ready.',
      '<span class="say">“If the test gets the credit,” Dev tells her later, “you have to hope the next one is easy too.”</span>'],
      choices:[['Rewrite the scene','Rewind and send a different reply','s4']]},
    s4b:{when:'Plot twist', paras:[
      '<span class="text">Dev: luck doesn’t make flashcards for 3 weeks</span>',
      'Nia looks at the stack in her bag. There are 94 of them.',
      '<span class="say">“If luck gets the credit,” Dev says, “you can’t use it next time. If <em>you</em> get the credit, you can.”</span>'],
      choices:[['Rewrite the scene','Rewind and send a different reply','s4']]},
    s4c:{when:'Week 10 · Friday, 3:41 p.m.', paras:[
      '<span class="text">Dev: LET’S GO. so you CAN do science</span>',
      '<span class="text">Nia: …i guess i can</span>',
      'That night she writes a new note under the one from week 3.'],
      note:[['What happened','81 on the chapter 5 test.'],['What I did','Made 94 flashcards over three weeks. Did the practice test. Asked Ms. Reyes about what I got wrong. Used Priya’s flow chart.'],['Will it work again?','Yes, if I do the same things.'],['Where else could it work?','Spanish vocab. I’ll try flashcards there next week.']],
      after:['With bad events, the skill is keeping them temporary and specific. With good events it’s the reverse: give yourself the credit, expect it to happen again, and let it spread to other parts of your life.','That’s how one 81 becomes evidence about who you are.'],
      end:true}
  }},
  ladder:{prompt:'Help Nia build her ladder. Tap the steps in order, starting with the bottom rung (tonight) and ending at the top (test day).',
    steps:['Make 10 flashcards for section 5.1 tonight.','Quiz herself on the flashcards for 10 minutes every day.','Add flashcards for 5.2 and 5.3 as the class covers them.','Do the practice test at the end of the chapter and mark what she missed.','Ask Ms. Reyes about the questions she got wrong.','Take the unit test.'],
    after:'“Every rung is small enough to do,” Ms. Reyes says, “and each one is a little higher than the last. That’s the whole trick.”'},
  real:{
    where:'Real story · Oxford, England, 1954', title:'Forty-six days',
    paras:[
      'For years the best runners in the world had chased the four-minute mile and kept falling just short. Some people wondered whether it could be done at all.',
      'Roger Bannister was a medical student. He couldn’t train all day, so he trained in short, hard sessions fitted around his hospital work: repeated laps at a set pace, getting a little faster over the weeks.',
      'On May 6, 1954, on a windy evening at an Oxford track, he ran the mile in 3 minutes 59.4 seconds.',
      'Forty-six days later, the Australian runner John Landy ran it even faster, in 3:58.0. Within a few years, several more runners had broken four minutes.',
      'Two kinds of confidence-building are in this story:'],
    list:['<b>Small steps.</b> Bannister built up with short sessions that got slightly harder over time.','<b>Seeing it done.</b> Once one person broke the barrier, other runners knew it was possible.'],
    after:['Nobody handed them confidence. Bannister built it by doing, step by step. The runners who followed built it by watching.'],
    source:'Based on widely reported historical accounts; details simplified for teaching.',
    q:'Why do you think other runners broke four minutes so soon after Bannister?',
    opts:[['They all suddenly got stronger.','Bodies don’t change that fast. Something else changed.',false],
          ['Seeing someone do it showed them it was possible.','Yes. Watching someone succeed is one of the four main sources of self-belief.',true],
          ['The races got easier.','Still a mile, still the same tracks. What changed was belief.',false]]
  },
  know:[
    {q:'According to psychologist Albert Bandura, what builds belief in yourself most strongly?',
     o:['Being told you’re great','Succeeding at something yourself, step by step','Reading about successful people','Wishing hard enough'], a:1,
     why:'Mastery experiences, meaning your own successes, are the strongest source. Each one is evidence you can do it.'},
    {q:'Your goal is to get better at guitar. Which is the best first step?',
     o:['Become a great guitarist','Practice switching from G to C for 10 minutes today','Watch a lot of concerts','Buy a better guitar'], a:1,
     why:'A good first step is small, specific and something you can do today.'},
    {q:'Whose example will most likely boost your confidence?',
     o:['A pro athlete who was always talented','A classmate like you who improved with practice','A celebrity','A character in a movie'], a:1,
     why:'Seeing someone similar to you succeed is the kind of example that convinces you that you can do it too.'},
    {q:'Before a big game your heart is pounding. Which thought helps most?',
     o:['I’m panicking.','My body is getting ready to perform.','I have to make this feeling go away first.','Something is wrong with me.'], a:1,
     why:'Reading nerves as energy instead of danger can help people perform better.'},
    {q:'You got a B+ after studying hard. Which explanation builds agency?',
     o:['I got lucky.','The test was easy.','My studying worked, and I can do it again.','The teacher likes me.'], a:2,
     why:'Crediting your own actions means you can repeat them on purpose.'}
  ],
  recap:{title:'Four ways to build belief, plus one', items:[
    ['Do it','Take small steps that get a little harder. Each success is evidence.'],
    ['See it','Watch someone like you do it.'],
    ['Hear it','Get specific feedback about what worked.'],
    ['Feel it','Read nerves as energy, not danger.'],
    ['Then take the credit','Explain wins by what you did, so you can do it again.']]},
  apply:{type:'mc', pass:6, items:[
    {ctx:'Ana · Goal: run a 5K in March', cat:'step', t:'Which is the best first step this week?',
     o:['Run 5K every day starting tomorrow.','Walk-run for 15 minutes, three times this week.','Think about running more.','Buy new running shoes.'], a:[1],
     why:'A first step should be small enough to do this week and just hard enough to stretch you. Walk-running three times does both.'},
    {ctx:'Theo · Goal: speak up more in class', cat:'step', t:'Which is the best first step?',
     o:['Lead the next class debate.','Ask one question in one class this week.','Stop being shy.','Wait until he feels confident.'], a:[1],
     why:'Confidence usually comes after the action, not before. One question is a step he can actually take.'},
    {ctx:'Mia · After scoring twice in a soccer game', cat:'credit', t:'Which explanation builds agency?',
     o:['The other team’s goalie was bad.','I got lucky today.','I practiced my shooting all week, and it paid off.','Coach put me in at the right time.'], a:[2],
     why:'When she credits her practice, she knows what to do again next week.'},
    {ctx:'Jun · Before a piano recital', cat:'nerves', t:'His hands are shaking. Which thought helps most?',
     o:['I’m going to mess up.','My body is getting ready to perform.','I have to calm down completely first.','Everyone can see I’m nervous.'], a:[1],
     why:'Reading nerves as energy instead of danger can help people perform better.'},
    {ctx:'Leo · Wants to learn to code', cat:'model', t:'Whose story would help Leo most?',
     o:['A tech billionaire who started coding at age 8.','A senior at his school who started coding in 10th grade and now builds apps.','A movie about hackers.','A poster that says “Anyone can code!”'], a:[1],
     why:'Someone close to Leo’s age and starting point is the kind of example that makes success feel possible.'},
    {ctx:'Aisha · After a good Spanish quiz', cat:'feedback', t:'Which feedback to herself is most useful?',
     o:['I’m awesome.','Not bad, I guess.','Practicing vocab out loud every night helped me remember the words.','Spanish is easy anyway.'], a:[2],
     why:'Specific feedback names exactly what worked, so she can do it again.'},
    {ctx:'Omar · Goal: raise math from a C to a B', cat:'step', t:'He’s done 10 practice problems a night for two weeks, and it’s getting easy. What next?',
     o:['Keep doing exactly the same thing.','Jump to studying three hours a night.','Add a few harder problems each week.','Stop, since it’s working.'], a:[2],
     why:'Once a rung feels easy, move up a little. Too big a jump and he’ll quit.'},
    {ctx:'Rosa · Just got a part in the school play', cat:'credit', t:'Which thought spreads the win in a useful way?',
     o:['That was a fluke.','I prepared hard for the audition, and I can use the same approach for my debate tryout.','I’m better than everyone.','I’d better not get my hopes up.'], a:[1],
     why:'With good events, let them be permanent and pervasive: this win is evidence about what you can do elsewhere.'}
  ]},
  live:{type:'wins', intro:'Pick a goal of your own and climb it one rung at a time. Each time you take a step, log the win and give yourself the credit.'}

5:{
  story:{start:'s1', scenes:{
    s1:{when:'Week 14 · Advisory, 9:10 a.m.', paras:[
      'Ms. Alvarez hands out a sheet with two boxes on it. One says <em>Me at 18</em>. The other says <em>Me at 25</em>.',
      '<span class="say">“Don’t write what you think I want to read,” she says. “Write who you’d actually like to be. Then, on the back, one person you’re afraid of turning into.”</span>',
      'For ten minutes Nia writes nothing. Then she remembers the hospital.',
      'When her little brother Tobi was born ten weeks early, he spent six weeks in the NICU, the hospital unit for newborns who need intensive care. Nia was eleven. Most of the adults were too worried to talk to her. One nurse, Grace, wasn’t. She showed Nia how the feeding tube worked and let her hold Tobi’s hand through the porthole of the incubator.',
      'Nia picks up her pencil.'],
      ask:{q:'Which version of Nia’s “Me at 25” is most likely to change what she does this year?', opts:[
        ['“Successful and happy.”',false,'Everyone wants that. It’s too vague to tell her what to do on Monday.'],
        ['“A NICU nurse, like Grace. To get there: biology, chemistry, and finding out what nurses actually do.”',true,'Yes. A possible self works best when it’s specific and linked to steps you can take now.'],
        ['“Famous.”',false,'That’s a wish about other people’s attention. It doesn’t point to any steps.']]},
      next:'s2'},
    s2:{when:'Week 15 · Nia’s room, 10:40 p.m.', paras:[
      'On the back of the sheet, under <em>Afraid of becoming</em>, she wrote: <em>someone who quits when things get hard.</em>',
      'All week Nia keeps picturing it: navy scrubs, a quiet unit at night, a tiny baby finally going home. The daydream feels great. She replays it on the bus, in the shower, in bed.',
      'She doesn’t open her chemistry-prep packet once.',
      '<span class="say">On Monday she tells Ms. Alvarez. “I can see it so clearly. So why am I not doing anything?”</span>',
      '<span class="say">“Because your brain feels like you’re already there,” Ms. Alvarez says. “A psychologist named Gabriele Oettingen found that just daydreaming about a goal can make people put in <em>less</em> effort. The fix is to picture the goal, then picture what’s in the way. It’s called WOOP.”</span>'],
      interactive:'woop', next:'s3'},
    s3:{when:'Week 18 · Course selection, 1:15 p.m.', paras:[
      'The course selection form for tenth grade arrives. Nia flips straight to science.',
      '<b>Honors Biology II</b>: <em>requires a B+ average in Biology I.</em>',
      'Nia has a B−. Her 81 helped, but not enough.',
      'She looks at the <em>Me at 25</em> sheet, folded in the front of her binder.'],
      choices:[['What Nia thinks','“That’s it. I’m not nurse material.”','s3a'],
               ['What Nia thinks','“This road is closed. What other roads go there?”','s3b']]},
    s3a:{when:'Plot twist', paras:[
      'Nia crumples the sheet and drops it in the recycling bin.',
      'For a moment it feels like relief. Then she remembers what she wrote on the back: <em>someone who quits when things get hard.</em>',
      '<span class="say">“One closed door isn’t a closed building,” Ms. Alvarez says when she hears. “Want to look for another way in?”</span>'],
      choices:[['Rewrite the scene','Rewind and think again','s3']]},
    s3b:{when:'Week 18 · Ms. Alvarez’s room, 3:05 p.m.', paras:[
      '<span class="say">Ms. Alvarez pulls a chair over. “Okay. Pathways. The goal stays the same. Let’s list the routes.”</span>'],
      interactive:'alts', next:'s4'},
    s4:{when:'Week 19 · Saturday', paras:[
      'Nia’s mom still has Grace’s number. Nia writes the message four times before sending it.',
      '<span class="text">Nia: hi, this is Nia Okafor, Tobi’s sister. you were his nurse in the NICU 4 years ago. I want to be a NICU nurse. can I ask how you did it?</span>',
      'Grace calls that evening. They talk for forty minutes.',
      'Grace failed chemistry the first time and retook it in summer school. She went to community college for two years, then transferred into a nursing program. She has worked in the NICU for twelve years.',
      '<span class="say">“Nobody’s path is a straight line,” Grace says. “Mine had a detour in it. Detours still get you there.”</span>'],
      note:[['Me at 25','A NICU nurse who explains things to scared families, the way Grace did.'],['Afraid of becoming','Someone who quits when things get hard.'],['This month’s WOOP','Finish the chemistry packet. If it’s after dinner and I think “tomorrow,” I put my phone in the kitchen and do one page.'],['Routes','Regular Bio II, and ask about honors at midyear. HOSA club. Summer chemistry if I need it.']],
      after:['The future isn’t a place you wait to arrive at. You picture it, name what’s in the way, and build more than one road to it.'],
      end:true}
  }},
  woop:{prompt:'Help Nia write her first WOOP for this month. Pick the best card for each step. The next step opens when you get one right.', slots:[
    {k:'Wish', hint:'Something you want that’s hard but possible in the next few weeks.', o:[
      ['Become a nurse.',false,'That’s the long-term goal. A WOOP works best for something in the next few weeks.'],
      ['Finish the chemistry-prep packet before winter break.',true,'Yes: hard, possible, and close enough to act on now.'],
      ['Never feel stressed again.',false,'She can’t control that. Pick a wish she can act on.']]},
    {k:'Outcome', hint:'The best result. Imagine it for a moment.', o:[
      ['Getting it over with.',false,'That’s relief, not a result she wants. What would be great about finishing?'],
      ['Starting tenth-grade chemistry already knowing the basics, and feeling ready instead of behind.',true,'That’s vivid and personal. Picture it for a few seconds.'],
      ['Making Ms. Alvarez happy.',false,'Pick the outcome Nia wants for herself.']]},
    {k:'Obstacle', hint:'What inside you gets in the way?', o:[
      ['The packet is long.',false,'True, but it’s outside her. The most useful obstacle is something Nia does, thinks or feels.'],
      ['Chemistry is boring.',false,'Closer, but vague. When exactly does she get stuck, and what does she do then?'],
      ['When I’m tired after dinner, I tell myself I’ll do it tomorrow, and then I scroll my phone.',true,'Yes. That’s an obstacle inside her, at a specific moment, so she can plan around it.']]},
    {k:'Plan', hint:'If [the obstacle shows up], then I will [one action].', o:[
      ['I’ll try harder.',false,'That isn’t a plan. What will she do, and when?'],
      ['If it’s after dinner and I think “tomorrow,” then I’ll put my phone in the kitchen and do one page.',true,'Yes. An if-then plan links the exact moment of the obstacle to one specific action.'],
      ['If I fail, then I’ll feel bad.',false,'That predicts a feeling, not an action. The “then” should be something she does.']]}],
    after:'“Wish, Outcome, Obstacle, Plan,” Ms. Alvarez says. “Dream first, then get real.”'},
  alts:{prompt:'Pick every route that could still get Nia to nursing.',
    opts:[
      ['Take regular Biology II and ask about moving into honors at midyear.',true,'Many schools allow a midyear move with a teacher’s recommendation.'],
      ['Join the school’s HOSA club for students interested in health careers.',true,'Real experience, and a way to meet people working in health care.'],
      ['Ask Grace how she became a nurse.',true,'Someone who has done it knows the real routes.'],
      ['Drop science, since honors is out.',false,'That closes more doors. Nursing programs need science.'],
      ['Wait and hope the honors rule changes.',false,'Waiting isn’t a route. Pick things Nia can do.']],
    miss:'Look for routes Nia can act on herself that keep science in the picture. Change your picks and check again.',
    after:'“Three roads,” Ms. Alvarez says. “If one closes, you take another. That’s what hope really is: a goal, plus more than one way to reach it.”'},
  real:{
    where:'Real research · Detroit, early 2000s', title:'The eighth graders who drew a map',
    paras:[
      'Psychologist Daphna Oyserman worked with eighth graders at middle schools in low-income Detroit neighborhoods. Many of the students had big hopes for adulthood, but no clear sense of how today connected to them.',
      'Her program, called School-to-Jobs, met in small groups for about a dozen sessions. Students described the adults they hoped to become and the ones they were afraid of becoming. Then came the important part: they drew timelines from now to adulthood, named the obstacles they expected, and planned ways past them.',
      'Researchers compared these students with similar students who didn’t take the program. Over the next two years, the School-to-Jobs students had better grades and test scores, missed less school, and got in trouble less.',
      'Three things made it work:'],
    list:['<b>Hoped-for and feared selves together.</b> Students had something to move toward and something to avoid.','<b>Linked to now.</b> The future self was connected to steps in eighth grade, not left as a dream.','<b>Obstacles expected.</b> Students knew difficulty was normal, so a setback didn’t mean the dream was wrong.'],
    after:['Picturing the future helped only when it came with a map.'],
    source:'Oyserman, Bybee &amp; Terry, “Possible selves and academic outcomes,” <em>Journal of Personality and Social Psychology</em>, 2006. Summarized for teaching.',
    q:'What made picturing the future actually change what these students did?',
    opts:[['Dreaming as big as possible.','Big dreams alone weren’t what made the difference.',false],
          ['Connecting the future self to steps now, and planning for obstacles.','Yes. The map from today to the future is what made the difference.',true],
          ['Being told they would be successful.','Nobody told them that. They built the route themselves.',false]]
  },
  know:[
    {q:'What did psychologist Gabriele Oettingen find about only daydreaming about a goal?',
     o:['It makes you work harder.','It can feel so good that you put in less effort.','It has no effect.','It guarantees success.'], a:1,
     why:'Positive daydreams alone can trick your brain into feeling you’ve already arrived.'},
    {q:'What does WOOP stand for?',
     o:['Work, Organize, Overcome, Push','Wish, Outcome, Obstacle, Plan','Want, Outline, Optimize, Perform','Win, Own, Open, Proceed'], a:1,
     why:'Wish, Outcome, Obstacle, Plan: dream first, then get real.'},
    {q:'Which is the most useful obstacle to name in a WOOP?',
     o:['The test will be hard.','When I’m tired after practice, I tell myself I’ll study later, and then I don’t.','My teacher is strict.','Life is unfair.'], a:1,
     why:'The most useful obstacle is inside you, at a specific moment, so you can plan for it.'},
    {q:'Which of these is a real if-then plan?',
     o:['I’ll study more.','If it’s 7 p.m. on a school night, then I’ll put my phone in the kitchen and open my notes.','I hope I’ll do better.','If I fail, then I’ll be sad.'], a:1,
     why:'The “if” names the moment; the “then” names one specific action.'},
    {q:'Your planned route to a goal is blocked. What helps most, according to hope research?',
     o:['Pick a completely new goal.','Find other routes to the same goal.','Wait for luck.','Keep pushing on the blocked route only.'], a:1,
     why:'Hopeful people keep the goal and generate more than one pathway to it.'}
  ],
  recap:{title:'Ms. Alvarez’s future toolkit', items:[
    ['Possible selves','A hoped-for self and a feared self, both linked to steps you can take now.'],
    ['WOOP','Wish, Outcome, Obstacle, Plan. Dream first, then get real.'],
    ['If-then plans','If [the moment the obstacle shows up], then I will [one specific action].'],
    ['Pathways','If one route closes, keep the goal and find another route.']]},
  apply:{type:'mc', pass:6, items:[
    {ctx:'Kenji · Wants to be an architect', cat:'self', t:'Which possible self is most useful?',
     o:['Rich and famous someday.','An architect who designs schools. This year: take geometry seriously and join the art club.','Someone who is never bored.','Whatever happens, happens.'], a:[1],
     why:'It’s specific, and it links the future self to steps he can take this year.'},
    {ctx:'Dani · Wish: pass the driving test', cat:'obstacle', t:'Which is the best obstacle to name?',
     o:['The DMV is always crowded.','I freeze up when someone is watching me drive.','Cars are expensive.','The test is hard.'], a:[1],
     why:'Freezing up is inside her and happens at a specific moment, so she can plan for it.'},
    {ctx:'Marcus · Wish: finish homework before gaming', cat:'plan', t:'Which if-then plan is strongest?',
     o:['I’ll try to be better about it.','If I get home from school, then I’ll do homework first and only then turn on the console.','If I fail, then I’ll feel bad.','I’ll do it when I feel like it.'], a:[1],
     why:'It names the moment (getting home) and one clear action.'},
    {ctx:'Lucía · Wants to be a vet', cat:'pathways', t:'The animal shelter only takes volunteers aged 16 and up. She’s 14. What’s her best next move?',
     o:['Give up on being a vet.','Ask a local vet clinic about shadowing, and join an animal-care club until she’s 16.','Wait two years and do nothing.','Complain about the rule online.'], a:[1],
     why:'Same goal, new routes. Pathways thinking means finding another way when one is blocked.'},
    {ctx:'Ravi · Science fair', cat:'fantasy', t:'Ravi spends an hour every night picturing himself winning the state science fair. He hasn’t started his project. What would help most?',
     o:['Picture the win in even more detail.','Picture the win, then the obstacle in the way, and make an if-then plan.','Stop thinking about the future.','Tell everyone he’s going to win.'], a:[1],
     why:'Daydreaming alone can drain motivation. Pairing it with the obstacle and a plan turns it into action.'},
    {ctx:'Imani · Feared self', cat:'self', t:'Which feared self is most useful?',
     o:['I’m afraid I’ll fail at everything.','I don’t want to be someone who quits soccer when it gets hard, so I’ll go to every practice this month.','I’m not afraid of anything.','The future scares me.'], a:[1],
     why:'A useful feared self is specific and comes with a strategy to avoid it.'},
    {ctx:'Theo · Wish: speak up in class', cat:'plan', t:'His obstacle: “My mind goes blank when everyone looks at me.” Which plan matches it?',
     o:['If class starts, then I’ll be brave.','If my mind goes blank, then I’ll look at the note I wrote before class and read my first sentence.','I’ll stop being nervous.','If it’s Monday, then I’ll eat breakfast.'], a:[1],
     why:'The “if” is the exact obstacle, and the “then” is a concrete action that gets past it.'},
    {ctx:'Sara · Wants to go to college', cat:'pathways', t:'Her family can’t afford a four-year college. Which shows pathways thinking?',
     o:['College isn’t for people like me.','List three routes (community college then transfer, scholarships, work-study) and ask the counselor about each.','Hope to win the lottery.','Decide later.'], a:[1],
     why:'She keeps the goal and maps several routes to it.'}
  ]},
  live:{type:'woop', intro:'Write a WOOP for something you want in the next few weeks. Then come back and mark whether you followed your plan.'}
},
6:{
  story:{start:'s1', scenes:{
    s1:{when:'Week 24 · HOSA meeting, 3:10 p.m.', paras:[
      'Half the chairs in Room 114 are empty. Since January, when the district cut the late bus, anyone without a ride home can’t stay after school.',
      'Theo walks forty minutes to get home after meetings. Jess stopped coming. Amara’s mom leaves work early twice a week to pick her up.',
      '<span class="say">Ms. Alvarez looks at the empty chairs. “Capstone projects start this week,” she says. “Pick a real problem. Change something.”</span>',
      'Nia looks at Theo. Theo looks at Nia. <span class="say">“Late bus,” they say at the same time.</span>',
      'Their first job, Ms. Alvarez says, is a control map: what the team controls, what it can influence, and what it can’t touch.'],
      interactive:'buckets', next:'s2'},
    s2:{when:'Week 26 · Principal’s office, 7:45 a.m.', paras:[
      'In two weeks the team sends a survey to 300 students. 112 answer. 41 say they would join a club or stay for extra help if there were a late bus.',
      'Nia, Theo, Amara and Jess bring a one-page proposal to Mr. Haddad, the principal. He reads every line. Then he slides it back across the desk.',
      '<span class="say">“This is good work,” he says. “But the answer is no. There’s no money for a late bus this year.”</span>',
      'In the hallway, the thoughts come fast.'],
      thoughts:['t1','t2'], hint:'Catch both. You’ve been practicing this since Level 2.', next:'s3'},
    s3:{when:'Week 26 · Hallway, 7:58 a.m.', paras:[
      '<span class="say">Nia stops walking. “Wait. Detective time,” she says. Theo groans. He’s heard about Dev.</span>'],
      ask:{q:'What’s the strongest way to talk back to “Adults never listen to kids”?', opts:[
        ['“He read the whole proposal and called it good work. He said no to the money, not to the idea.”',true,'Yes. That’s evidence against the thought, and it points to the real obstacle: money.'],
        ['“Adults are the worst anyway.”',false,'That agrees with the trap and makes it bigger.'],
        ['“Whatever, it doesn’t matter.”',false,'That brushes it off instead of checking the facts.']]},
      after:['So the goal stays the same. The route has to change.'],
      next:'s4'},
    s4:{when:'Week 27 · Principal’s office, 7:45 a.m.', paras:[
      '<span class="say">The team goes back to Mr. Haddad with one question: “What would make it possible?”</span>',
      '<span class="say">He thinks about it. “If the money didn’t come from the school budget, and the bus company had a driver free, I’d sign off on a trial.”</span>',
      'Back in Room 114, Ms. Alvarez hands them a marker.'],
      interactive:'alts', next:'s5'},
    s5:{when:'Week 33 · Friday, 4:15 p.m.', paras:[
      'The city says no to free bus passes. The other two routes work.',
      'The PTA votes to fund a late bus on Tuesdays and Thursdays for the rest of the year, as a trial. The carpool sheet fills up with 23 families.',
      'It isn’t five days a week. But on the first Tuesday, the late bus pulls out with 31 students on it. Theo is one of them.',
      '<span class="text">Dev: wait YOU got a bus??</span>',
      'What does Nia say?'],
      choices:[['Nia’s reply','“we got lucky the PTA had money lol”','s5a'],
               ['Nia’s reply','“we got data, made a plan, and when the first route closed we found two more”','s5b']]},
    s5a:{when:'Plot twist', paras:[
      '<span class="text">Dev: lucky?? you surveyed 300 people</span>',
      'Nia thinks about the proposal, the 7:45 a.m. meeting, the hallway, and the PTA presentation she practiced six times.',
      'If luck gets the credit, you can’t use it next time.'],
      choices:[['Rewrite the scene','Rewind and send a different reply','s5']]},
    s5b:{when:'Week 34 · Spring showcase', paras:[
      '<span class="text">Dev: ok that’s actually huge</span>',
      'At the spring showcase the team presents to families and to next year’s ninth graders. Nia finishes with one slide. It isn’t about the bus.'],
      note:[['Level 1','Notice where your actions change things.'],['Level 2','Catch the thoughts that turn one event into a whole story.'],['Level 3','Check those thoughts against the evidence.'],['Level 4','Climb in small steps, and take the credit.'],['Level 5','Picture the future, name what’s in the way, and build more than one road.'],['Level 6','Do it with other people, on something real.']],
      after:['In September, Nia got a 58 and closed her notebook. In May, she helped put a bus on the road.','Agency isn’t a feeling you wait for. It’s something you build, one action at a time.'],
      end:true}
  }},
  thoughts:{
    t1:{text:'Adults never listen to kids.'},
    t2:{text:'We wasted two weeks. This whole project is pointless.'}
  },
  buckets:{prompt:'Help the team build its control map. Put each item where it belongs.', cats:['We control','We can influence','We can’t control'], items:[
    ['Surveying students about who needs a late bus',0,'The team can do this themselves, starting tomorrow.'],
    ['Writing a proposal for the principal',0,'Fully in their hands.'],
    ['What the principal decides',1,'They can’t make the decision, but good data and a clear plan can affect it.'],
    ['Whether families sign up to carpool',1,'Families decide, but the team can make it easy and ask.'],
    ['The district’s transportation budget for this year',2,'It was set months ago. Spending energy here would drain the team.'],
    ['Gas prices',2,'Nobody at the school controls this.']]},
  alts:{prompt:'Pick every route the team could try now.',
    opts:[
      ['Ask the PTA to fund a late bus two days a week as a trial.',true,'The PTA raises its own money, so it’s outside the school budget.'],
      ['Organize a carpool sign-up sheet for families.',true,'This needs no money at all.'],
      ['Ask the city about free youth passes for the public bus.',true,'A different route to the same goal: getting students home.'],
      ['Start a petition to replace the principal.',false,'He said yes to the idea. Attacking him closes a door that’s open.'],
      ['Wait for next year’s budget.',false,'Waiting isn’t a route. Pick things the team can do now.']],
    miss:'Look for routes that get students home without the school budget and keep Mr. Haddad on your side. Change your picks and check again.',
    after:'“Three routes,” Theo says. “If one closes, we still have two.”'},
  real:{
    where:'Real story · Bali, Indonesia, 2013–2019', title:'Two sisters and a bag ban',
    paras:[
      'In 2013, Melati and Isabel Wijsen were 12 and 10 years old and living in Bali. After a school lesson about people who had changed the world, they asked what they could change at home. Plastic bags were everywhere: on beaches, in rivers, in rice fields.',
      'With friends from school they started a campaign called Bye Bye Plastic Bags. They collected petition signatures, organized beach cleanups, gave talks at schools, and kept asking government officials for meetings.',
      'Change was slow. Meetings led to promises, and promises took years. They kept the goal and kept finding new routes.',
      'In December 2018, Bali’s government announced a ban on single-use plastic bags, plastic straws and styrofoam, which took effect in 2019.',
      'You can see the program’s skills in their story:'],
    list:['<b>Control.</b> They started with things they could do themselves: cleanups, talks, signatures.','<b>Influence.</b> They couldn’t make the law, but they could keep showing the people who could.','<b>Pathways.</b> When one route stalled, they tried another.'],
    after:['Their campaign later spread to young volunteer teams in many other countries.'],
    source:'Based on widely reported accounts; details simplified for teaching.',
    q:'The ban came about five years after they started. What kept the project going that long?',
    opts:[['A lucky change in government.','Luck can’t be planned. Look at what the sisters did.',false],
          ['They kept finding new routes: petitions, cleanups, school talks, meetings with officials.','Yes. Pathways thinking, kept up for years.',true],
          ['Nobody disagreed with them.','Plenty of people did. That’s partly why it took five years.',false]]
  },
  know:[
    {q:'Your team wants to fix a problem at school. What’s the first thing to map?',
     o:['Who to blame','What’s in our control, what we can influence, and what we can’t touch','How famous the project could get','What the perfect result would look like'], a:1,
     why:'A control map shows where your energy will actually make a difference.'},
    {q:'The principal says no to your proposal. Which response shows talking back to a trap thought?',
     o:['“Adults never listen.”','“He said no to this plan, not to the goal. Let’s ask what would make it possible.”','“We should give up.”','“Let’s complain online.”'], a:1,
     why:'It checks the evidence: one “no” to one plan isn’t a “no” to everything.'},
    {q:'Goal: start a recycling program at school. Which is the best first rung?',
     o:['Convince the whole district to recycle.','Count how many recyclable items the cafeteria throws away in one lunch period.','Buy 50 recycling bins.','Wait for the school to start one.'], a:1,
     why:'Small, doable this week, and it gives you evidence for the next step.'},
    {q:'Your team’s obstacle: “We stop meeting when we get busy.” Which is the best if-then plan?',
     o:['We’ll try to be more committed.','If someone misses Tuesday’s meeting, then we’ll each post a three-line update in the group chat that night.','If we get busy, then we’ll quit.','We’ll meet when we feel like it.'], a:1,
     why:'It names the moment the obstacle shows up and one clear action.'},
    {q:'Your project partly works: a late bus two days a week, not five. Which explanation builds agency?',
     o:['We failed.','We got lucky.','We changed something real, we know which actions worked, and we can push for more.','The adults did it for us.'], a:2,
     why:'Credit your actions and let the win spread. Partial success is still evidence.'}
  ],
  recap:{title:'The whole toolkit, in one place', items:[
    ['Control map','What we control, what we can influence, what we can’t touch.'],
    ['Catch and talk back','Notice trap thoughts, then check them against the evidence.'],
    ['Small rungs','Start with a step you can do this week.'],
    ['WOOP and if-then','Name the obstacle inside the team and plan for the moment it shows up.'],
    ['Pathways and credit','Keep the goal, find new routes, and credit what you did.']]},
  apply:{type:'mc', pass:6, items:[
    {ctx:'Team Green · Cafeteria food waste', cat:'control', t:'Which of these is in the team’s control?',
     o:['The district’s food contract.','Measuring how much food gets thrown away for one week.','What every student chooses to eat.','The cafeteria’s budget.'], a:[1],
     why:'They can do the measuring themselves. The rest belongs to other people.'},
    {ctx:'Team Safe Walk · A crosswalk near school', cat:'control', t:'Which can they influence but not control?',

const KEY = 'plot-twist-v1';
function lvl(){return {story:false, real:false, know:{best:0,attempts:0,passed:false}, apply:{best:0,attempts:0,passed:false,misses:{}}, live:[], cleared:false}}
function fresh(){return {demo:false, preview:false, view:{name:'path'}, levels:{2:lvl(),3:lvl(),4:lvl(),5:lvl(),6:lvl()}}}
function load(){try{const r=localStorage.getItem(KEY); if(!r) return null; const s=JSON.parse(r); if(!(s&&s.levels&&s.levels[2])) return null; for(const k of [4,5,6]) if(!s.levels[k]) s.levels[k]=lvl(); return s}catch(e){return null}}
